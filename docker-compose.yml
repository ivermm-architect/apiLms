name: cieba-lms

services:
  postgres:
    image: postgres:16-alpine
    container_name: cieba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cieba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cieba_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cieba_lms}
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cieba} -d ${POSTGRES_DB:-cieba_lms}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cieba-net

volumes:
  postgres_data:
    driver: local

networks:
  cieba-net:
    driver: bridge
